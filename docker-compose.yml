services:

  # ── Aplicación Django + Gunicorn ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: tension_project.settings.production
      # Opcional: aumentar workers en servidores con más CPU
      GUNICORN_WORKERS: "3"
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # Para usar una BD externa, comenta este servicio y ajusta DATABASE_URL en .env
  # a: postgres://usuario:password@host_externo:puerto/nombre_bd
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tension
      POSTGRES_USER: tension_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tension_user -d tension"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No exponer puerto al host en producción (solo acceso interno)
    # ports:
    #   - "5432:5432"

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"      # Preparado para TLS
    volumes:
      - ./deploy/nginx/tension-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      # Para Certbot (descomentar al activar HTTPS):
      # - certbot_conf:/etc/letsencrypt:ro
      # - certbot_www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy

# ── Volúmenes persistentes ────────────────────────────────────────────────
volumes:
  postgres_data:
  staticfiles:
  # certbot_conf:
  # certbot_www:
