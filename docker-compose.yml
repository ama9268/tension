services:

  # ── Aplicación Django + Gunicorn ──────────────────────────────────────────
  # Traefik (Dokploy) actúa como reverse proxy y gestiona SSL.
  # Nginx no es necesario; los estáticos los sirve WhiteNoise desde Gunicorn.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: tension_project.settings.production
      GUNICORN_WORKERS: "3"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tension
      POSTGRES_USER: tension_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tension_user -d tension"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Volúmenes persistentes ────────────────────────────────────────────────
volumes:
  postgres_data:
